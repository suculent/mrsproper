# electron-builder packaging configuration — signing + notarization active (APP-03)
# Electron 37.10.3 — LSMinimumSystemVersion: 11.0 (Big Sur+) per D-16
# macOS notarization triggered automatically when env vars are set:
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
# Dev builds without these env vars warn and skip notarization gracefully.

appId: cz.corpus.mrsproper
# productName is the binary stem: MrsProper.app on macOS, MrsProper.exe on Windows.
# The human-readable display name "Mrs. Proper" is set via platform extendInfo below.
productName: MrsProper
copyright: Copyright © 2026 Mrs. Proper

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - "!**/.DS_Store"
  # Do NOT exclude node_modules: electron-vite externalizes runtime deps (e.g.
  # `telegram`) from the main bundle, so electron-builder must bundle the production
  # dependency tree into the asar. electron-builder includes prod deps automatically
  # and omits devDependencies — excluding all node_modules broke `require('telegram')`.

# macOS — APP-01, APP-03 (signed + notarized)
# Electron 37.10.3 — LSMinimumSystemVersion: 11.0 (Big Sur+) per D-16
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # identity key removed — auto-detect Developer ID Application cert from Keychain
  # To pin explicitly: identity: "Developer ID Application: Matej Sychra (8VN6AYV2LV)"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # build/icon.png (round source, 1024x1024) — electron-builder derives icns from this
  icon: build/icon.png
  # CFBundleDisplayName provides the human-readable "Mrs. Proper" display name in Finder/Dock
  extendInfo:
    CFBundleDisplayName: "Mrs. Proper"
  # notarize: not set = auto from APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER env vars
  # Dev builds without env vars: notarizeIfProvided warns and skips gracefully
  # To explicitly disable: notarize: false

dmg:
  title: Mrs. Proper
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows — APP-02 (unsigned per D-05)
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # build/icon-win.png (square source, 1024x1024) — electron-builder derives ico from this
  icon: build/icon-win.png
  # No signingHashAlgorithms / certificateFile — unsigned-runnable (Phase 7 adds signing)

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${productName}-${version}-portable.exe"
